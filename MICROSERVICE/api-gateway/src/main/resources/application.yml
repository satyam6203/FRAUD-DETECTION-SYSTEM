server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            id: payment-service
              uri: "${PAYMENT_SERVICE_URI:http://localhost:8081}"
              predicates:Path=/api/v1/payments/**

            id: fraud-detection-service
              uri: "${FRAUD_SERVICE_URI:http://localhost:8082}"
              predicates:
                - Path=/api/v1/fraud/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    gateway:
      enabled: true
