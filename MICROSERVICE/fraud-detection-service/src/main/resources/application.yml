server:
  port: 8082

spring:
  application:
    name: fraud-detection-service

  datasource:
    url: jdbc:postgresql://localhost:5432/frauddetection
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true